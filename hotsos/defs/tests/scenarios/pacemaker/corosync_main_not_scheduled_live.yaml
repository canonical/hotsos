# The standard harness adds sos_commands/date/date. Run this fixture
# separately with a live-root runner to test without sos_commands.
target-name: corosync_main_not_scheduled.yaml
data-root:
  files:
    var/log/syslog: |
      Feb 10 08:48:13 juju-04f1e3-1-lxd-5 corosync[1234]:   [MAIN  ] Corosync main process was not scheduled for 2652.4536 ms (threshold is 800.0000 ms). Consider token timeout increase.
raised-issues:
  PacemakerWarning: Corosync logged 1 scheduling pause warning(s) in syslog on
    Feb 10 (threshold 800.0000 ms, 80% of the token timeout), risking
    membership changes and resource failover. Please compare those log times
    with CPU load and %steal using 'sar -t -q -u -f var/log/sysstat/saDD' (the
    saDD or saYYYYMMDD file covering the pause) from the sosreport root, or
    from / on the node. Please check the token timeout as
    runtime.config.totem.token in sos_commands/corosync/corosync-cmapctl for a
    sosreport, or with 'corosync-cmapctl -g runtime.config.totem.token' on the
    node.
