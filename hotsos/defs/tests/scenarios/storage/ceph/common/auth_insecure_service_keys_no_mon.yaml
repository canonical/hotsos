target-name: auth_insecure_service_keys.yaml
data-root:
  files:
    sos_commands/systemd/systemctl_list-units: |
      UNIT LOAD ACTIVE SUB DESCRIPTION
      ceph-osd@0.service loaded active running Ceph object storage daemon
    sos_commands/systemd/systemctl_list-unit-files: |
      UNIT FILE STATE VENDOR PRESET
      ceph-mon.service disabled enabled
      ceph-mon@.service disabled enabled
      ceph-osd@.service enabled enabled
    sos_commands/dpkg/dpkg_-l: |
      ii  ceph-common  19.2.6-0ubuntu0.24.04.1  arm64  Ceph utilities
    # After a binary upgrade both checks can persist until credentials and
    # the ticket cipher are changed in that order.
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_ERR",
          "checks": {
              "AUTH_INSECURE_CLIENT_KEY_TYPE": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "1 auth client entities with insecure key types",
                      "count": 1
                  },
                  "detail": [
                      {
                          "message": "entity client.admin using insecure key type: aes"
                      }
                  ],
                  "muted": false
              },
              "AUTH_INSECURE_SERVICE_KEY_TYPE": {
                  "severity": "HEALTH_ERR",
                  "summary": {
                      "message": "3 auth service entities with insecure key types",
                      "count": 3
                  },
                  "detail": [
                      {
                          "message": "entity mgr.juju-1a2b3c-0 using insecure key type: aes"
                      },
                      {
                          "message": "entity osd.0 using insecure key type: aes"
                      },
                      {
                          "message": "entity osd.1 using insecure key type: aes"
                      }
                  ],
                  "muted": false
              },
              "AUTH_INSECURE_SERVICE_TICKETS": {
                  "severity": "HEALTH_ERR",
                  "summary": {
                      "message": "Monitors are configured to issue insecure service tickets",
                      "count": 1
                  },
                  "detail": [],
                  "muted": false
              }
          },
          "mutes": []
      }
  copy-from-original:
    - sos_commands/date/date
raised-bugs:
  https://www.cve.org/CVERecord?id=CVE-2025-30156: >-
    Collected Ceph health detail reports AUTH_INSECURE_SERVICE_KEY_TYPE and
    AUTH_INSECURE_SERVICE_TICKETS: service keys and tickets use insecure
    CephX cryptography (CVE-2025-30156). Please upgrade the affected daemons
    to the latest version, then follow
    https://docs.ceph.com/en/latest/rados/configuration/auth-config-ref/#cephx-upgrade
    to rotate service keys before changing the service-ticket cipher.
