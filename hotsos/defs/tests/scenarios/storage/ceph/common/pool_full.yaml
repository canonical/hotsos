data-root:
  files:
    sos_commands/ceph_mon/json_output/ceph_status_--format_json-pretty: |
      {
          "fsid": "eccf3d48-859f-11ec-9de2-d72b3e8a3058",
          "health": {
              "status": "HEALTH_ERR"
          }
      }
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_ERR",
          "checks": {
              "POOL_FULL": {
                  "severity": "HEALTH_ERR",
                  "summary": {
                      "message": "1 pools full"
                  },
                  "muted": false
              }
          },
          "mutes": []
      }
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephWarning: >-
    Ceph reports POOL_FULL for one or more pools. Pools may be near or
    at quota or marked full. Writes may be blocked. Please check quotas
    with 'ceph df detail'
    and individual OSD usage with 'ceph osd df'.
