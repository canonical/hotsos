data-root:
  files:
    sos_commands/ceph_mon/json_output/ceph_status_--format_json-pretty: |
      {
          "fsid": "eccf3d48-859f-11ec-9de2-d72b3e8a3058",
          "health": {
              "status": "HEALTH_WARN"
          }
      }
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_WARN",
          "checks": {
              "OLD_CRUSH_TUNABLES": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "crush map has legacy tunables (require bobtail, min is hammer)"
                  },
                  "muted": false
              }
          },
          "mutes": []
      }
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephCrushWarning: >-
    Ceph reports OLD_CRUSH_TUNABLES: the CRUSH map's tunables require an
    older client release than `mon_crush_min_required_version`, which may
    give less optimal data placement. Please verify all clients support
    the `optimal` CRUSH tunables profile before applying it; changing
    tunables can trigger significant data movement. Please see
    https://docs.ceph.com/en/latest/rados/operations/crush-map/#tunables
