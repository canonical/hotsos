data-root:
  files:
    sos_commands/ceph_mon/json_output/ceph_health_detail_--format_json-pretty: |
      {
          "status": "HEALTH_WARN",
          "checks": {
              "AUTH_INSECURE_GLOBAL_ID_RECLAIM": {
                  "severity": "HEALTH_WARN",
                  "summary": {
                      "message": "client.34990 at 10.0.0.1:0/1032241397 is using insecure global_id reclaim"
                  },
                  "muted": false
              }
          },
          "mutes": []
      }
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-bugs:
  https://www.cve.org/CVERecord?id=CVE-2021-20288: >-
    This Ceph cluster has one or more clients or daemons that are not
    securely reclaiming their global_id (AUTH_INSECURE_GLOBAL_ID_RECLAIM).
    These are typically clients that have not yet been upgraded to a
    version patched against CVE-2021-20288. If
    auth_allow_insecure_global_id_reclaim is later disabled to harden the
    cluster, these clients will fail to (re)authenticate until they are
    upgraded. Check 'ceph health detail' for the affected clients and
    upgrade them before disabling insecure global_id reclaim.
