raised-bugs:
  https://bugs.launchpad.net/bugs/2019293: >-
    The Ceph manager on this host hit the assertion
    'pending_service_map.epoch > service_map.epoch' and crashed during an
    mgr fail-over after the newly active mgr received multiple service map
    updates (LP2019293, observed from Octopus onwards). This can crash the
    newly active mgr and delay fail-over. Please upgrade Ceph to the latest
    version to resolve this issue.
