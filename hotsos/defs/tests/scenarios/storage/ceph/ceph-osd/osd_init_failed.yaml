raised-issues:
  CephOSDWarning: >-
    ceph-osd on this host failed to start 2 time(s) on 2022-02-09, 2022-02-10 after
    logging 'osd init failed' with error(s) (13) Permission denied, (5) Input/output error, so the OSD(s) logging it
    exited at startup. Please search the ceph-osd.*.log files for 'osd init
    failed' to find the OSD id(s) and the lines logged before the error, and
    please check with 'ceph osd tree' whether those OSDs are up now.
