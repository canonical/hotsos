target-name: osd_init_failed.yaml
data-root:
  files:
    var/log/ceph/ceph-osd.3.log: "2022-02-10T10:20:30.104+0000 7f5e8f2a1f00 -1 bluestore(/var/lib/ceph/osd/ceph-3/block) _read_bdev_label failed to open /var/lib/ceph/osd/ceph-3/block: (13) Permission denied\n2022-02-10T10:20:30.105+0000 7f5e8f2a1f00 -1 osd.3 0 OSD:init: unable to mount object store\n2022-02-10T10:20:30.123+0000 7f5e8f2a1f00 -1 \u001b[0;31m ** ERROR: osd init failed: (13) Permission denied\u001b[0m\n2022-02-10T10:31:05.442+0000 7f8d1e7a3f00  0 osd.3 1288 done with init, starting boot process\n2022-02-10T10:31:06.913+0000 7f8d0f2b7700  1 osd.3 1290 state: booting -> active\n"
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephOSDWarning: >-
    ceph-osd on this host failed to start 1 time(s) on 2022-02-10 after
    logging 'osd init failed' with error(s) (13) Permission denied, so the OSD(s) logging it
    exited at startup. Please search the ceph-osd.*.log files for 'osd init
    failed' to find the OSD id(s) and the lines logged before the error, and
    please check with 'ceph osd tree' whether those OSDs are up now.
