target-name: osd_init_failed.yaml
data-root:
  files:
    var/log/ceph/ceph-osd.3.log: "2022-02-10T10:20:30.119+0000 7f5e8f2a1f00 -1 osd.3 0 OSD::init() : unable to read osd superblock\n2022-02-10T10:20:30.123+0000 7f5e8f2a1f00 -1 \u001b[0;31m ** ERROR: osd init failed: (22) Invalid argument\u001b[0m\n"
  copy-from-original:
    - sos_commands/date/date
    - sos_commands/systemd/systemctl_list-units
    - sos_commands/systemd/systemctl_list-unit-files
raised-issues:
  CephOSDWarning: >-
    Local ceph-osd failed to start 1 time(s) on 2022-02-10 after logging 'osd
    init failed' with error(s) (22) Invalid argument. Please search
    ceph-osd*.log* for 'osd init failed' to find the OSD IDs and preceding
    lines. Please see ceph.local-osds in the storage summary for the OSDs' up
    state at collection time, where listed. Please check 'ceph osd tree' or
    'microceph.ceph osd tree' for current state.
