target-name: bluestore_zero_block_crc.yaml
data-root:
  files:
    var/snap/microceph/common/logs/ceph-osd.1.log: |
      2026-11-07T02:18:32.791+0000 7faf9d3bb700 -1 bluestore(/var/lib/ceph/osd/ceph-1) _verify_csum bad crc32c/0x1000 checksum at blob offset 0x0, got 0x6706be76, expected 0xc939ea08, device location [0x41822f0000~1000], logical extent 0x200000~1000, object #2:4a3b1c2d:::rbd_data.1f2e3d4c5b6a.0000000000000a1b:head#
raised-issues:
  CephOSDWarning: >-
    ceph-osd logged 1 BlueStore CRC32C errors for OSD 1 on 2026-11-07, reporting
    got 0x6706be76 for 4 KiB. This checksum does not prove the read data
    was zero or identify the cause. With bluestore_ignore_data_csum disabled,
    repeated mismatches can return I/O error after configured retries.
    Please inspect kernel, device and Ceph logs. Please review
    BLUESTORE_SPURIOUS_READ_ERRORS in 'ceph health detail'. Please consult
    https://docs.ceph.com/en/latest/rados/operations/health-checks/#bluestore-spurious-read-errors
    for possible causes.
