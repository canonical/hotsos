data-root:
  files:
    sos_commands/block/lsblk_-O_-P: |
      NAME="vda" KNAME="vda" PATH="/dev/vda" TYPE="disk" SIZE="100G" RO="0" PTTYPE="gpt" PTUUID="uuid-1" FSTYPE="" MOUNTPOINT="" PKNAME=""
      NAME="vda1" KNAME="vda1" PATH="/dev/vda1" TYPE="part" SIZE="100G" RO="0" PTTYPE="" PTUUID="" FSTYPE="ext4" MOUNTPOINT="/" PKNAME="vda"
      NAME="vdb" KNAME="vdb" PATH="/dev/vdb" TYPE="disk" SIZE="50G" RO="0" PTTYPE="" PTUUID="" FSTYPE="" MOUNTPOINT="" PKNAME=""
      NAME="vdc" KNAME="vdc" PATH="/dev/vdc" TYPE="disk" SIZE="200G" RO="0" PTTYPE="" PTUUID="" FSTYPE="LVM2_member" MOUNTPOINT="" PKNAME=""
  copy-from-original:
    - sos_commands/date/date
    - uptime
raised-issues:
  StorageWarning: >-
    The following disk(s) appear entirely unused with no partition table,
    filesystem, or LVM configuration: /dev/vdb (50G). Please inspect these devices
    and partition, format, or configure them for use if intended, or ignore
    this warning if they are intentionally unconfigured.
