raised-bugs:
  https://bugs.launchpad.net/bugs/2166984: >-
    This host is running an OVN version affected by LP2166984 and its
    ovn-controller logs show virtual ports with virtual-parents being
    claimed, which is the keepalived VIP failover pattern that triggers the
    bug. After a VIP fails over to a new virtual parent, OVN's Southbound
    Mac_Binding table is not refreshed to the new owning MAC, so traffic to
    the VIP is sent to the wrong chassis and the VIP becomes unreachable
    until keepalived is restarted. There is currently no fixed OVN package
    available. Please track LP2166984 and upgrade OVN to the latest version
    once a fix is released; in the meantime, configure keepalived to send
    periodic gratuitous ARPs (for example vrrp_garp_master_refresh > 0) so
    the Mac_Binding is refreshed after failover.
