raised-bugs:
  https://bugs.launchpad.net/bugs/1990978: >-
    This host is affected by a known Open vSwitch Raft bug where the OVSDB
    server transfers cluster leadership every 10-20 minutes after
    compaction (5 transfers found in the space of an hour in the OVN
    OVSDB logs), which destabilises the OVN control plane. Please upgrade
    Open vSwitch to the latest version to resolve this issue.
