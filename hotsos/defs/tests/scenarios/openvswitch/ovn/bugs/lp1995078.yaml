raised-bugs:
  https://bugs.launchpad.net/bugs/1995078: >-
    The active (highest priority) OVN gateway chassis 'osc5' does not match
    the active chassis 'osc4' of the HA chassis group used by external
    ports. When these differ, baremetal and external VLAN ports scheduled
    on the HA chassis lose connectivity to their router gateway. This is a
    known bug (LP1995078). Please align the Gateway_Chassis priorities with
    the HA_Chassis_Group priorities so the same chassis is active for both
    (for example 'ovn-nbctl set gateway_chassis <uuid> priority=<n>') and
    verify baremetal/external port connectivity is restored.
