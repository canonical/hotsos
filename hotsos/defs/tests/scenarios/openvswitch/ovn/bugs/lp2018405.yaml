raised-bugs:
  https://bugs.launchpad.net/bugs/2018405: >-
    This host is affected by a known bug where terminated SSL connections
    between OpenStack agents and the ovn-central OVSDB servers are not
    handled correctly, leaving ovsdbapp stuck in an OSError loop
    ("Transport endpoint is not connected"). Please upgrade Open vSwitch to
    the latest version to resolve this issue.
