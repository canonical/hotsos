raised-bugs:
  https://bugs.launchpad.net/bugs/1988942: >-
    This host is affected by a known Cinder bug where setting a volume
    image-metadata value longer than 255 characters is rejected ("Invalid
    input for field/attribute ... is too long"), even though such values
    can be stored from Glance, which breaks backup/restore workflows that
    need to restore the original metadata. Please upgrade Cinder to the
    latest version to resolve this issue.
