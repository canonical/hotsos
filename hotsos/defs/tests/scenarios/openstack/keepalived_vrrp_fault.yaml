    Historical keepalived logs record 2 FAULT transition(s) for VRRP
    instance(s) VR_1, reducing virtual IP redundancy during those faults.
    Please inspect preceding interface/script errors in /var/log/syslog*.
    Please check which peer holds the virtual IPs from keepalived.conf using
    'ip address' in the instance's namespace ('ip netns exec NAMESPACE ip
    address' for Neutron routers).
