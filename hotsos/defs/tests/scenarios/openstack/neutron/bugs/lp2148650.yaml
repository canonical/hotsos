  files:
    var/log/neutron/neutron-server.log: |
      2022-02-08 09:15:03.212 41 ERROR neutron_vpnaas.services.vpn.service_drivers.ovn_ipsec [req-1f2c3d4e-5a6b-7c8d-9e0f-112233445566 - - - - -] Cidr 169.254.0.0/28 of subnet abcd1234-0000-1111-2222-333344445555 overlaps with cidr 169.254.0.0/28 of subnet 99887766-5544-3322-1100-ffeeddccbbaa
  copy-from-original:
