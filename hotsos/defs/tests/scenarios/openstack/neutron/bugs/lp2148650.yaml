raised-bugs:
  https://bugs.launchpad.net/bugs/2148650: >-
    neutron-server is stuck in a retry loop logging "overlaps with cidr
    169.254.0.0/28" while creating an OVN IPsec VPN service. This is a known
    bug (LP2148650) where the neutron-vpnaas ovn_ipsec driver retries
    transit-subnet allocation non-idempotently after an OVSDB transaction
    error, repeatedly hitting a CIDR overlap and leaving the VPN service in
    PENDING_CREATE/ERROR. As a workaround, please delete the stuck VPN
    service along with its leftover 169.254.0.0/28 transit subnet before
    recreating it, and upgrade neutron to the latest version to resolve
    this issue.
