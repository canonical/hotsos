raised-bugs:
  https://bugs.launchpad.net/bugs/2141119: >-
    Octavia is unable to load one or more enabled provider drivers and, on
    an affected version of the octavia package, this prevents the Octavia
    API from starting, leaving it unavailable (HTTP 503). A misconfigured
    or failing driver in enabled_provider_drivers is enough to trigger the
    failure. Please upgrade octavia packages to the latest version for your
    release to resolve this issue.
