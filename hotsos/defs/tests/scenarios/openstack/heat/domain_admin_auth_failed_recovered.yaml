target-name: domain_admin_auth_failed.yaml
data-root:
  files:
    sos_commands/dpkg/dpkg_-l: |
      ii  keystone                             2:21.0.0-0ubuntu1~cloud0                             all          OpenStack identity service - Django web application
      ii  nova-common                          3:25.2.1-0ubuntu2.7~cloud0                           all          OpenStack Compute - common files
      ii  neutron-common                       2:20.3.0-0ubuntu1~cloud0                             all          Neutron is a virtual network service for Openstack - common
      ii  cinder-common                        2:20.3.0-0ubuntu1~cloud0                             all          Cinder storage service - common files
    # The credentials were rejected once and a stack was created later. The
    # failure is still reported with its date; the message says it may have
    # been fixed since.
    var/log/heat/heat-engine.log: |
      2022-02-10 10:28:35.123 1234 ERROR heat.engine.clients.os.keystone.heat_keystoneclient [req-1 - - - - -] Domain admin client authentication failed
      2022-02-10 12:00:00.123 1234 INFO heat.engine.stack [req-5 - - - - -] Stack CREATE COMPLETE (s1): Stack CREATE completed successfully
  copy-from-original:
    - sos_commands/date/date
raised-issues:
  OpenstackWarning: >-
    heat-engine logged 'Domain admin client authentication failed' 1
    time(s) on 2022-02-10. Authentication of the stack domain admin or trustee
    failed, which may have affected stack operations. Please check the Heat
    credentials and Keystone logs for the failure; it may have been resolved.
