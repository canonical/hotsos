    var/log/gnocchi/gnocchi-metricd.log: |
      2022-02-10 06:14:46,123 [12345] ERROR gnocchi.cli.metricd Unexpected error during processing job: lz4.block.LZ4BlockError: Decompression failed: corrupt input or insufficient space in destination buffer
  copy-from-original:
