raised-bugs:
  https://bugs.launchpad.net/bugs/2148798: >-
    This host is affected by a known bug where a truncated Carbonara
    object makes gnocchi-metricd raise an uncaught lz4.block.LZ4BlockError
    and enter a permanent crash loop, blocking the entire telemetry
    pipeline because metricd retries the same object every cycle. Please
    upgrade Gnocchi to the latest version to resolve this issue.
