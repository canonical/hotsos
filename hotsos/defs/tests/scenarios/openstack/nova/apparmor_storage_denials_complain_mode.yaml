target-name: apparmor_storage_denials.yaml
data-root:
  files:
    # nova-compute profile is loaded but in complain mode, so matching
    # denials are only logged (not actually blocked) and should not raise.
    sos_commands/apparmor/apparmor_status: |
      30 profiles are in enforce mode.
         /usr/bin/haproxy
      2 profiles are in complain mode.
         /usr/bin/nova-compute
    var/log/kern.log: |
      Feb 10 02:15:03 compute4 kernel: [1381807.338196] audit: type=1400 audit(1646348231.139:38839): apparmor="DENIED" operation="exec" profile="/usr/bin/nova-compute" name="/sbin/multipath" pid=3178525 comm="nova-compute" requested_mask="x" denied_mask="x" fsuid=0 ouid=0
      Feb 10 05:20:11 compute4 kernel: [1381818.448855] audit: type=1400 audit(1646348242.252:38857): apparmor="DENIED" operation="open" profile="/usr/bin/nova-compute" name="/dev/sda" pid=3181986 comm="lsscsi" requested_mask="r" denied_mask="r" fsuid=0 ouid=0
  copy-from-original:
    - sos_commands/date/date
