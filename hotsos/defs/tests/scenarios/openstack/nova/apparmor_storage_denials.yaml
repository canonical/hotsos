raised-issues:
  OpenstackWarning:
    - >-
      AppArmor has denied nova-compute permission to execute 1
      storage-related command(s) (multipath) in the last 48 hours e.g. on
      Feb 10. This can prevent os-brick from managing multipath, iSCSI, FC
      or NVMe volumes correctly and cause instance attach/detach failures.
      Please review the denials in /var/log/kern.log and update the
      nova-compute apparmor profile to allow executing the required
      storage tools.
