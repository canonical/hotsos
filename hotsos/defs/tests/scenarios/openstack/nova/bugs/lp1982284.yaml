data-root:
  files:
    var/log/nova/nova-compute.log: |
      2022-02-10 06:14:46.123 12345 ERROR nova.virt.libvirt.driver [req-abc - - - - -] Live Migration failure: libvirt.libvirtError: internal error: migration was active, but no RAM info was set
  copy-from-original:
    - sos_commands/date/date
raised-bugs:
  https://bugs.launchpad.net/bugs/1982284: >-
    This host is affected by a known bug where a race in the Nova live
    migration monitoring thread makes libvirt raise "internal error:
    migration was active, but no RAM info was set", causing Nova to treat
    an otherwise successful live migration as failed. Please upgrade Nova
    to the latest version to resolve this issue.
