raised-bugs:
  https://bugs.launchpad.net/bugs/2006960: >-
    This host has an os-brick version (6.1.2-0ubuntu1~cloud0) affected by a
    known bug (LP#2006960) and 5 log entries in the last 24 hours
    showing a LUN (e.g. 356) repeatedly not found on sysfs, which
    happens for LUN IDs greater than 255 on storage backends using
    non-SAM addressing (e.g. Pure Storage) because os-brick does not
    correctly translate the LUN address. Please upgrade os-brick to the
    latest version to resolve this issue.
