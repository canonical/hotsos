    var/log/nova/nova-compute.log: |
      2022-02-10 06:14:46.462 2 ERROR nova.compute.manager [req-abc - - - - -] Error updating resources for node compute1.: TypeError: virNodeDeviceLookupByName() argument 2 must be str or None, not Proxy
  copy-from-original:
