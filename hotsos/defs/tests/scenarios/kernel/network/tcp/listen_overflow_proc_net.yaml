target-name: listen.yaml
data-root:
  files:
    proc/net/netstat: |
      TcpExt: ListenOverflows ListenDrops TCPReqQFullDrop
      TcpExt: 1000 0 0
raised-issues:
  KernelWarning: >-
    tcp accept queue overflow (drops=1000). Applications are not accepting
    connections fast enough or their listen backlog is too small. Please
    check the listening applications and net.core.somaxconn. Related
    counters: ListenOverflows=1000, ListenDrops=0, TCPReqQFullDrop=0. See the
    net.core.somaxconn and net.ipv4.tcp_max_syn_backlog settings under
    network.sysctl in the kernel summary;
    network.tcp-sockets.queued-listeners lists any listening sockets currently
    backing up.
