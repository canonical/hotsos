target-name: listen.yaml
data-root:
  files:
    proc/net/netstat: |
      TcpExt: TCPReqQFullDrop
      TcpExt: 600
raised-issues:
  KernelWarning: >-
    tcp request queue full, syncookies off (drops=600). Please check whether
    the listed ports are under a SYN flood and consider enabling
    net.ipv4.tcp_syncookies or increasing net.ipv4.tcp_max_syn_backlog.
    Related counters: ListenOverflows=0, ListenDrops=0, TCPReqQFullDrop=600.
    See network.tcp-sockets.half-open-ports in the kernel summary to identify
    the ports receiving SYNs.
