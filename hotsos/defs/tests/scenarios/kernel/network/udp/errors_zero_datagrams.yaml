target-name: errors.yaml
data-root:
  files:
    proc/net/snmp: |
      Udp: InDatagrams InErrors OutDatagrams RcvbufErrors SndbufErrors
      Udp: 0 600 0 700 800
raised-issues:
  KernelWarning:
    - >-
      UDP ingress errors are at 600 (0% of total datagrams). Please
      check the UDP sockets with queued data or drops, the receive buffer
      sizes and the interface error counters. See
      network.udp-sockets.receive-queue and network.interfaces.rx-errors in
      the kernel summary to identify the affected sockets and interfaces.
    - >-
      UDP receive buffer errors are at 700 (0% of total rx).
      Receivers are not reading datagrams fast enough or their receive
      buffer is too small. Please check the receiving applications and
      net.core.rmem_max. See network.udp-sockets.receive-queue and
      net.core.rmem_max under network.sysctl in the kernel summary to
      identify the sockets with queued data.
    - >-
      UDP send buffer errors are at 800 (0% of total tx). Senders
      are producing datagrams faster than they can be transmitted or their
      send buffer is too small. Please check the sending applications,
      net.core.wmem_max and the interface error counters. See
      network.udp-sockets.send-queue and network.interfaces.tx-errors in the
      kernel summary to identify the affected sockets and interfaces.
