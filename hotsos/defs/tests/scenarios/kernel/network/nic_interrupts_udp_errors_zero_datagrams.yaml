target-name: nic_interrupts.yaml
data-root:
  files:
    proc/net/snmp: |
      Udp: InDatagrams RcvbufErrors
      Udp: 0 600
    proc/interrupts: |2
                 CPU0       CPU1       CPU2       CPU3
       25:      90000          0          0          0   PCI-MSI 524288-edge      virtio0-input.0
       26:       5000          0          0          0   PCI-MSI 524289-edge      virtio0-output.0
raised-issues:
  KernelWarning: >-
    Network device interrupts (/proc/interrupts): cpu0 handles 100% of 95000
    interrupts; IRQ 25 virtio0-input.0: 90000 (cpu0 100%); IRQ 26
    virtio0-output.0: 5000 (cpu0 100%). Interrupt handling is not spread
    across CPUs. Please check that irqbalance is running, the smp_affinity
    of the IRQs above and whether the NIC is using multiple queues
    (ethtool -l). See network.interrupts.nic-irqs in the kernel summary for
    the per-IRQ distribution. Hard-IRQ handling for these interrupts runs on
    cpu0, but RPS/RFS may steer the subsequent receive processing to other
    CPUs, so check the RPS CPU masks in
    /sys/class/net/<iface>/queues/rx-*/rps_cpus (and, for RFS, the per-queue
    rps_flow_cnt together with net.core.rps_sock_flow_entries) and see
    network.softnet-drops (packets lost because net.core.netdev_max_backlog
    was full) and network.softnet-time-squeeze (receive work deferred because
    net.core.netdev_budget ran out, no loss) to identify the CPUs actually
    affected.
