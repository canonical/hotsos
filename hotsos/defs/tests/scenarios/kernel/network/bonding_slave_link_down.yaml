raised-issues:
  NetworkWarning: >-
    The bonding driver disabled slave(s) eno1, eno2, enp3s0f1 of bond0,
    bond1 after their link went down (3 'link status definitely down'
    line(s)) on 2022-02-10, Feb 10. A bond may have failed over or lost
    connectivity, and the links may have come back since. Please check
    /proc/net/bonding for those bonds, ethtool for those slaves, the switch
    ports and, if the bond uses arp_interval, whether the ARP targets
    answer.
