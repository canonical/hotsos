checks:
  # LP1987355 is a keystonemiddleware bug so the presence of an affected
  # (pre-fix) python3-keystonemiddleware version is the only deterministic way
  # to identify it - the log line on its own matches any service token
  # validation failure. Each range is bounded by the lowest fixed version in
  # its release line (the ~cloud variant sorts below the archive revision).
  package_vulnerable:
    apt:
      python3-keystonemiddleware:
        # ussuri (focal archive) + UCA ussuri
        - min: '9.0.0'
          lt: '9.0.0-0ubuntu1.1~cloud0'
        # UCA victoria
        - min: '9.1.0'
          lt: '9.1.0-0ubuntu1~cloud1'
        # UCA wallaby
        - min: '9.2.0'
          lt: '9.2.0-0ubuntu1~cloud1'
        # UCA xena
        - min: '9.3.0'
          lt: '9.3.0-0ubuntu1~cloud1'
        # yoga (jammy archive) + UCA yoga
        - min: '9.4.0'
          lt: '9.4.0-0ubuntu1.1~cloud0'
        # zed (UCA)
        - min: '10.0.0'
          lt: '10.1.0-0ubuntu1~cloud1'
  has_1987355:
    input:
      - var/log/apache2/cinder_error.log
      - var/log/cinder/cinder-api.log
      - var/log/nova/nova-api-wsgi.log
    search:
      expr: '([\d-]+) ([\d:]+)[\.,]\d{3,6} .+keystonemiddleware\.auth_token .+Error validating X-Service-Token'
      constraints:
        search-result-age-hours: 168  # 7 days
conclusions:
  lp1987355:
    decision:
      - package_vulnerable
      - has_1987355
    raises:
      type: LaunchpadBug
      bug-id: 1987355
      message: >-
        This host is running a version of python3-keystonemiddleware that is
        affected by a known bug where a valid service token is rejected
        ("Error validating X-Service-Token") when the associated user token
        expires mid-request. The expired user token is cached as invalid, so a
        subsequent request that reuses it fails even when accompanied by a
        valid service token, which can leave Cinder volumes stuck in the
        "detaching" state for long-running clients that reuse tokens (e.g. the
        Kubernetes Cinder CSI plugin). Please upgrade python3-keystonemiddleware
        to the latest version available for your release to resolve this issue.
