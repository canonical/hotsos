checks:
  logs:
    input: var/log/neutron/neutron-server.log
    search:
      expr: '([\d-]+) ([\d:]+)\.\d{3} .+ neutron_lib.exceptions.dns.DuplicateRecordSet: Name \S+ is duplicated in the external DNS service'
      constraints:
        search-result-age-hours: 168  # max 7 days
conclusions:
  has_lp_1993628:
    decision: logs
    raises:
      type: LaunchpadBug
      bug-id: 1993628
      message: >-
        Neutron has DuplicateRecordSet exceptions which indicate this bug
        (LP1993628) where external DNS zones are not updated properly when ports
        are deleted. Please see the bug for details.
