checks:
  has_2091071:
    input: var/log/neutron/neutron-server.log
    search:
      expr: '([\d-]+) ([\d:]+)\.\d{3} .+ ERROR neutron\.api\.v2\.resource .+ delete failed: TypeError: unhashable type: ''list'''
      constraints:
        search-result-age-hours: 168  # 7 days
conclusions:
  lp2091071:
    decision: has_2091071
    raises:
      type: LaunchpadBug
      bug-id: 2091071
      message: >-
        This host is affected by a known bug where deleting an OVN agent fails
        in neutron-server with "TypeError: unhashable type: 'list'", leaving
        decommissioned agents as zombies in the agent list that cannot be
        removed. Please upgrade Neutron to the latest version to resolve this
        issue.
