checks:
  has_1965297:
    input:
      path: 'var/log/neutron/neutron-l3-agent.log'
    expr: '([\d-]+) [\d:]+\.\d{3} .+Gateway interface for router \S+ was not set up; router will not work properly'
conclusions:
  lp1965297:
    decision: has_1965297
    raises:
      type: LaunchpadBug
      bug-id: 1965297
      message: >-
        A known neutron l3-agent bug (LP1965297) is impacting HA routers on
        this host and can cause router updates to stall. Please upgrade neutron
        to the latest version to resolve this issue.
