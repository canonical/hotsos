checks:
  has_1944619:
    input:
      path: 'var/log/nova/nova-compute.log'
    expr: '([\d-]+) [\d:]+\.\d{3} .+attaching network adapter failed.: libvirt.libvirtError: Requested operation is not valid: PCI device'
    hint: 'libvirtError'
conclusions:
  lp1944619:
    decision: has_1944619
    raises:
      type: LaunchpadBug
      bug-id: 1944619
      message: >-
        This host is affected by a known OpenStack Nova bug (LP1944619) where
        attaching a network adapter to an instance fails with a libvirt error
        ('Requested operation is not valid: PCI device'). Please upgrade nova
        to the latest version to resolve this issue.
