checks:
  has_quoted_sslcafile:
    input:
      path: 'var/snap/juju-db/common/juju-db.config'
    expr: "^sslCAFile = '"
conclusions:
  gh23711:
    decision: has_quoted_sslcafile
    raises:
      type: GitHubBug
      bug-id: 'juju/juju#23711'
      message: >-
        The juju-db (mongodb 4.0) config on this Juju controller has a quoted
        sslCAFile path which stops mongod from starting, leaving the controller
        down (typically seen after upgrading to Juju 2.9.60). Please see the
        bug for the workaround and check that snap.juju-db.daemon is running.
