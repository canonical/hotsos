input:
  # default path that can be overriden
  path: 'var/log/juju/unit-*.log'
checks:
  units_have_leadership_errors:
    search:
      expr: '(\S+) (\S+) .+ERROR cannot write leadership settings: cannot write settings: failed to merge leadership settings: application "(\S+)"'
      constraints:
        search-result-age-hours: 168  # 7 days
  units_have_tracebacks_err_wrn:
    search:
      expr: '([\d-]+) ([\d:]+) (?:ERROR|WARNING) unit\.([^\.]+)\.\S+ .+ Traceback \('
      constraints:
        search-result-age-hours: 48
  units_have_tracebacks_info:
    search:
      expr: '([\d-]+) ([\d:]+) INFO unit\.([^\.]+)\.\S+ .+ Traceback \('
      constraints:
        search-result-age-hours: 48
conclusions:
  units-have-leadership-errors:
    decision: units_have_leadership_errors
    raises:
      type: JujuWarning
      message: >-
        Juju unit(s) '{units}' are showing leadership errors in their logs from
        the last 7 days. Please investigate.
      format-dict:
        units: '@checks.units_have_leadership_errors.search.results_group_3:unique_comma_join'
  units-have-tracebacks-err-wrn:
    decision: units_have_tracebacks_err_wrn
    raises:
      type: JujuWarning
      message: >-
        Juju logs for unit(s) '{units}' contain {num_tracebacks} Traceback(s) from
        the last 48 hours - please check.
      format-dict:
        units: '@checks.units_have_tracebacks_err_wrn.search.results_group_3:unique_comma_join'
        num_tracebacks: '@checks.units_have_tracebacks_err_wrn.search.num_results'
  units-have-tracebacks-info:
    decision: units_have_tracebacks_info
    raises:
      type: JujuWarning
      message: >-
        Juju logs for unit(s) '{units}' contain {num_tracebacks} Traceback(s) from
        the last 48 hours - please check. Note that these tracebacks are logged as INFO
        but they may still be worth investigating.
      format-dict:
        units: '@checks.units_have_tracebacks_info.search.results_group_3:unique_comma_join'
        num_tracebacks: '@checks.units_have_tracebacks_info.search.num_results'
