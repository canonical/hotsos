vars:
  incsumerr: '@hotsos.core.plugins.kernel.net.SNMPTcp.InCsumErrors'
  incsumrate_pcent: '@hotsos.core.plugins.kernel.net.SNMPTcp.InCsumErrorsPcentInSegs'
  outsegs: '@hotsos.core.plugins.kernel.net.SNMPTcp.OutSegs'
  retrans: '@hotsos.core.plugins.kernel.net.SNMPTcp.RetransSegs'
  outretrans_pcent: '@hotsos.core.plugins.kernel.net.SNMPTcp.RetransSegsPcentOutSegs'
  spurrtx: '@hotsos.core.plugins.kernel.net.NetStatTCP.TCPSpuriousRtxHostQueues'
  spurrtx_pcent: '@hotsos.core.plugins.kernel.net.NetStatTCP.TCPSpuriousRtxHostQueuesPcentOutSegs'
checks:
  incsumerr_high:
    or:
      - varops: [[$incsumerr], [gt, 500]]
      - varops: [[$incsumrate_pcent], [gt, 1]]
  incsumrate_gt_1pcent:
    varops: [[$incsumrate_pcent], [gt, 1]]
  retrans_out_rate_gt_1pcent:
    varops: [[$outretrans_pcent], [gt, 1]]
  spurrtx_gt_1pcent:
    varops: [[$spurrtx_pcent], [gt, 1]]
conclusions:
  incsumerr_high:
    decision: incsumerr_high
    raises:
      type: KernelWarning
      message: >-
        tcp ingress checksum errors are at {count}. This could mean that one
        or more interfaces are experiencing hardware errors. Please check the
        NIC, cable and checksum offload settings of the interfaces with errors.
        See network.interfaces.rx-errors in the kernel summary to identify the
        interfaces reporting errors.
      format-dict:
        count: $incsumerr
  incsumrate_gt_1pcent:
    decision: incsumrate_gt_1pcent
    raises:
      type: KernelWarning
      message: >-
        tcp ingress checksum error rate is at {rate}% of rx segments. Please
        check the NIC, cable and checksum offload settings of the interfaces
        with errors. See network.interfaces.rx-errors in the kernel summary to
        identify the interfaces reporting errors.
      format-dict:
        rate: $incsumrate_pcent
  retrans_out_rate_gt_1pcent:
    decision: retrans_out_rate_gt_1pcent
    raises:
      type: KernelWarning
      message: >-
        tcp retransmissions ({retrans}) are at {rate}% of tx segments ({outsegs}).
        Please check the network path to the busiest peers and the interface
        error counters. See network.tcp-sockets.retransmitting-connections and
        network.interfaces.tx-errors in the kernel summary to identify the
        busiest peers and any interfaces with errors.
      format-dict:
        outsegs: $outsegs
        retrans: $retrans
        rate: $outretrans_pcent
  spurrtx_gt_1pcent:
    decision: spurrtx_gt_1pcent
    raises:
      type: KernelWarning
      message: >-
        this host has {num} tcp retransmissions ({pcent}% of total) with the
        original still queued locally. The packets are backing up in the local
        transmit path rather than being delayed on the network. Please check
        the qdisc and device transmit queues (e.g. tc -s qdisc, ip -s link) and
        host scheduling pressure (CPU contention and softirq processing). See
        network.interfaces.tx-errors and
        network.tcp-sockets.retransmitting-connections in the kernel summary to
        identify any transmit-queue drops and the affected connections.
      format-dict:
        num: $spurrtx
        pcent: $spurrtx_pcent
