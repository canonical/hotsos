vars:
  inerrors: '@hotsos.core.plugins.kernel.net.SNMPUdp.InErrors'
  inerrors_pcent: '@hotsos.core.plugins.kernel.net.SNMPUdp.InErrorsPcentInDatagrams'
  rcvbuferrors: '@hotsos.core.plugins.kernel.net.SNMPUdp.RcvbufErrors'
  rcvbuferrors_pcent: '@hotsos.core.plugins.kernel.net.SNMPUdp.RcvbufErrorsPcentInDatagrams'
  sndbuferrors: '@hotsos.core.plugins.kernel.net.SNMPUdp.SndbufErrors'
  sndbuferrors_pcent: '@hotsos.core.plugins.kernel.net.SNMPUdp.SndbufErrorsPcentOutDatagrams'
  incsumerrors: '@hotsos.core.plugins.kernel.net.SNMPUdp.InCsumErrors'
  incsumerrors_pcent: '@hotsos.core.plugins.kernel.net.SNMPUdp.InCsumErrorsPcentInDatagrams'
  in_datagrams: '@hotsos.core.plugins.kernel.net.SNMPUdp.InDatagrams'
  out_datagrams: '@hotsos.core.plugins.kernel.net.SNMPUdp.OutDatagrams'
checks:
  # A zero datagram total makes the percentage 0 so the count alone decides.
  rcvbuferrors_high:
    and:
      - varops: [[$rcvbuferrors], [gt, 500]]
      - or:
          - varops: [[$rcvbuferrors_pcent], [gt, 1]]
          - varops: [[$in_datagrams], [eq, 0]]
  sndbuferrors_high:
    and:
      - varops: [[$sndbuferrors], [gt, 500]]
      - or:
          - varops: [[$sndbuferrors_pcent], [gt, 1]]
          - varops: [[$out_datagrams], [eq, 0]]
  inerrs_high_pcent_and_above_limit:
    and:
      - varops: [[$inerrors], [gt, 500]]
      - or:
          - varops: [[$inerrors_pcent], [gt, 1]]
          - varops: [[$in_datagrams], [eq, 0]]
  incsumerrs_high_and_above_limit:
    and:
      - varops: [[$incsumerrors], [gt, 500]]
      - or:
          - varops: [[$incsumerrors_pcent], [gt, 1]]
          - varops: [[$in_datagrams], [eq, 0]]
conclusions:
  inerrs_high_pcent_and_above_limit:
    decision: inerrs_high_pcent_and_above_limit
    raises:
      type: KernelWarning
      message: >-
        UDP ingress errors are at {count} ({pcent}% of total datagrams). Please
        check the UDP sockets with queued data or drops, the receive buffer
        sizes and the interface error counters. See
        network.udp-sockets.receive-queue and network.interfaces.rx-errors in
        the kernel summary to identify the affected sockets and interfaces.
      format-dict:
        count: $inerrors
        pcent: $inerrors_pcent
  incsumerrs_high_and_above_limit:
    decision: incsumerrs_high_and_above_limit
    raises:
      type: KernelWarning
      message: >-
        UDP ingress checksum errors are at {count} ({pcent}% of total datagrams). This could
        mean that one or more interfaces are experiencing hardware errors.
        Please check the NIC, cable and checksum offload settings of the
        interfaces with errors. See network.interfaces.rx-errors in the kernel
        summary to identify the interfaces reporting errors.
      format-dict:
        count: $incsumerrors
        pcent: $incsumerrors_pcent
  rcvbuferrors_high:
    decision: rcvbuferrors_high
    raises:
      type: KernelWarning
      message: >-
        UDP receive buffer errors are at {count} ({pcent}% of total rx).
        Receivers are not reading datagrams fast enough or their receive
        buffer is too small. Please check the receiving applications and
        net.core.rmem_max. See network.udp-sockets.receive-queue and
        net.core.rmem_max under network.sysctl in the kernel summary to
        identify the sockets with queued data.
      format-dict:
        count: $rcvbuferrors
        pcent: $rcvbuferrors_pcent
  sndbuferrors_high:
    decision: sndbuferrors_high
    raises:
      type: KernelWarning
      message: >-
        UDP send buffer errors are at {count} ({pcent}% of total tx). Senders
        are producing datagrams faster than they can be transmitted or their
        send buffer is too small. Please check the sending applications,
        net.core.wmem_max and the interface error counters. See
        network.udp-sockets.send-queue and network.interfaces.tx-errors in the
        kernel summary to identify the affected sockets and interfaces.
      format-dict:
        count: $sndbuferrors
        pcent: $sndbuferrors_pcent
