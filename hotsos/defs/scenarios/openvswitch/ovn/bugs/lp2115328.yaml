checks:
  has_2115328:
    input: 'openvswitch:ovn/ovn-controller.log'
    search:
      expr: '([\d-]+)T([\d:]+)\.\d+Z.+\|lflow\|WARN\|error parsing (?:actions "ct_commit_nat|match "flags\.from_ctrl)'
      constraints:
        search-result-age-hours: 48
  # Fixed in ovn 22.09.1 (Zed), 23.03.1 (Antelope) and 23.09.3 (Bobcat) UCA
  # releases so only flag versions below the fix within each series.
  ovn_pkg_affected:
    apt:
      ovn-common:
        - ge: 22.09.0
          lt: 22.09.1-0ubuntu0.22.10.1~cloud2
        - ge: 23.03.0
          lt: 23.03.1-1ubuntu0.23.04.1~cloud4
        - ge: 23.09.0
          lt: 23.09.3-0ubuntu0.23.10.1~cloud1
conclusions:
  lp2115328:
    decision:
      - has_2115328
      - ovn_pkg_affected
    raises:
      type: LaunchpadBug
      bug-id: 2115328
      message: >-
        The ovn-controller logs on this host contain flow parsing errors for
        the 'ct_commit_nat' action and/or 'flags.from_ctrl' field, indicating
        this node is running an OVN version that cannot parse logical flows
        generated by newer OVN peers. This is a known bug hit during stepped
        upgrades and can disrupt network traffic while OVN versions are
        mismatched. Please upgrade OVN to the latest version on all nodes to
        resolve this issue.
