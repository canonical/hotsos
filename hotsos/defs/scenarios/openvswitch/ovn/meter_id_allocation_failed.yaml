vars:
  expr_meter_id_allocation_failed: '([\d-]+)T([\d:]+)\.\d+Z\|\d+\|extend_table\|ERR\|table meter-table: out of table ids\.'
checks:
  meter_id_allocation_failed:
    input: 'openvswitch:ovn/ovn-controller.log'
    search:
      expr: $expr_meter_id_allocation_failed
conclusions:
  meter_id_allocation_failed:
    decision: meter_id_allocation_failed
    raises:
      type: OVNWarning
      message: >-
        OVN could not allocate meter-table IDs on {dates}. Affected rate
        limits or ACL logging may be missing. Please check capacity with
        `ovs-ofctl -O OpenFlow13 meter-features BRIDGE` and installed
        meters with `ovs-ofctl -O OpenFlow13 dump-meters BRIDGE` on the
        affected host, substituting the integration bridge name and your
        deployment's ovs-ofctl command.
      format-dict:
        dates: '@checks.meter_id_allocation_failed.search.results_group_1:unique_comma_join'
