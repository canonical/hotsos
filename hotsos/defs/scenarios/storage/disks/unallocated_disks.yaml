requires:
  property:
    path: hotsos.core.plugins.system.system.SystemBase.virtualisation_type
    ops: [[ne, lxc]]
vars:
  unallocated_disks: '@hotsos.core.plugins.storage.disks.DiskChecks.unallocated_disks'
checks:
  has_unallocated_disks:
    varops: [[$unallocated_disks], [length_hint], [gt, 0]]
conclusions:
  unallocated_disks:
    decision: has_unallocated_disks
    raises:
      type: StorageWarning
      message: >-
        The following partitioned disk(s) have significant unallocated free
        space not assigned to any partition: {disks}. Please inspect the
        partition layout and extend existing partitions or create new
        partitions to utilize the remaining space if intended, or ignore
        this warning if the space is intentionally left unallocated.
      format-dict:
        disks: '$unallocated_disks:comma_join'
