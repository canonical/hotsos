vars:
  overlap_common_msg: >-
    This will prevent PG autoscaler from scaling those pools. This happens
    when a pool uses a crush rule that doesn't distinguish between OSD
    device classes. Any pool using that crush rule would use OSDs from
    multiple device classes. Identify those pools
    (ceph osd crush tree --show-shadow) and change their crush rule to
    use only one of the device classes.
checks:
  overlapping_roots:
    input: 'storage.ceph:ceph-mgr*.log'
    expr:
      - '.* pool (\w+) scale due to overlapping roots:.*'
      - '.* pool (\w+) has overlapping roots: .*'
      - '.* pool (\w+) contains an overlapping root .*'
  overlapping_roots_crush_dump:
    property:
      path: hotsos.core.plugins.storage.ceph.CephCrushMap.crushmap_overlapping_roots
      ops: [[length_hint], [gt, 0]]
conclusions:
  overlapping-roots-from-crush-dump:
    priority: 1
    decision: overlapping_roots_crush_dump
    raises:
      type: CephMgrError
      message: >-
        Overlapping CRUSH roots detected: {roots}. This prevents the PG
        autoscaler from scaling the affected pools. Please run `ceph osd
        pool autoscale-status` and `ceph osd crush rule dump` to identify
        pools whose rules use overlapping roots, then assign each affected
        pool a CRUSH rule that targets a disjoint root with `ceph osd pool
        set <pool-name> crush_rule <rule-name>`. See the Ceph documentation
        for further guidance:
        https://docs.ceph.com/en/latest/rados/operations/placement-groups/#viewing-pg-scaling-recommendations.
      format-dict:
        roots: hotsos.core.plugins.storage.ceph.CephCrushMap.crushmap_overlapping_roots_pretty
  overlapping-roots-with-pools:
    priority: 2
    decision: overlapping_roots
    raises:
      type: CephMgrError
      message: >-
        PG autoscaler found overlapping roots for pools: {pools}. {common}
      format-dict:
        pools: "@checks.overlapping_roots.search.results_group_1:unique_comma_join"
        common: $overlap_common_msg
