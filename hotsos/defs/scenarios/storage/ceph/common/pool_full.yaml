checks:
  pool_full_reported:
    property:
      path: hotsos.core.plugins.storage.ceph.CephCluster.health_checks_unmuted
      ops: [[contains, POOL_FULL]]
conclusions:
  pool-full-reported:
    decision: pool_full_reported
    raises:
      type: CephWarning
      message: >-
        Ceph reports POOL_FULL for one or more pools near or at quota, or
        flagged full because an OSD reached its configured full threshold.
        Writes may be blocked. Please check quotas with 'ceph df detail'
        and individual OSD usage with 'ceph osd df'.
