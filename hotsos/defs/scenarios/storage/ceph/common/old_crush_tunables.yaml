checks:
  old_crush_tunables_reported:
    property:
      path: hotsos.core.plugins.storage.ceph.CephCluster.health_checks_unmuted
      ops: [[contains, OLD_CRUSH_TUNABLES]]
conclusions:
  old-crush-tunables:
    decision: old_crush_tunables_reported
    raises:
      type: CephCrushWarning
      message: >-
        Ceph reports OLD_CRUSH_TUNABLES: the CRUSH map's tunables require an
        older release than `mon_crush_min_required_version`, which may give
        less optimal data placement. Please mute this warning if older clients
        require the existing profile; otherwise, please verify client support
        before applying the `optimal` profile, which can trigger significant
        data movement. Please see
        https://docs.ceph.com/en/latest/rados/operations/crush-map/#tunables
